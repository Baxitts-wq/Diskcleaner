<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep futuristic background gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    
    <!-- Neon Electric Blue & Cyan gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Glowing filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="96" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="4"/>

  <!-- Logo Shape: Stylized circular sweeping blade and disk -->
  <g transform="translate(256, 256)">
    <!-- Outer Glow ring -->
    <circle r="140" fill="none" stroke="url(#accent-grad)" stroke-width="2" opacity="0.3" filter="url(#glow)" />
    
    <!-- Circular Track (PC Disk metaphor) -->
    <circle r="120" fill="none" stroke="#1e293b" stroke-width="12" />
    
    <!-- Fast sweeping blade segment 1 (cyan) -->
    <path d="M 0,-120 A 120,120 0 0,1 120,0" fill="none" stroke="url(#primary-grad)" stroke-width="16" stroke-linecap="round" filter="url(#glow)" />
    
    <!-- Fast sweeping blade segment 2 (blue) -->
    <path d="M 0,120 A 120,120 0 0,1 -120,0" fill="none" stroke="url(#accent-grad)" stroke-width="16" stroke-linecap="round" />

    <!-- Center Core / Node (Solid state disk microchip) -->
    <rect x="-40" y="-40" width="80" height="80" rx="20" fill="#0f172a" stroke="url(#primary-grad)" stroke-width="6" filter="url(#glow)" />
    
    <!-- Lightning bolt sweeping icon inside the core -->
    <path d="M -10,20 L 15,-10 L 0,-10 L 10,-25 L -15,5 L 0,5 Z" fill="url(#primary-grad)" />
    
    <!-- Micro-detail orbits representing optimization speed -->
    <circle cx="90" cy="-80" r="6" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="-90" cy="80" r="4" fill="#06b6d4" />
  </g>

  <!-- Title Text at the bottom -->
  <text x="256" y="440" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="32" fill="#ffffff" letter-spacing="4">
    DISK<tspan fill="#38bdf8">SWEEP</tspan>
  </text>
</svg>
